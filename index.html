<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5b21b6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AF スタンプラリー">
  <meta name="description" content="エニタイムフィットネス 全国スタンプラリー">
  <title>エニタイム スタンプラリー</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:#0a0a0a;color:#fff;font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;max-width:480px;margin:0 auto;min-height:100dvh;overscroll-behavior:none}

    /* ── Header ── */
    #header{background:linear-gradient(135deg,#5b21b6 0%,#1e0a45 100%);padding:14px 16px 12px;position:sticky;top:0;z-index:20}
    #header-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    #logo-box{width:34px;height:34px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    #app-title{font-size:16px;font-weight:900;letter-spacing:.03em}
    #app-sub{font-size:10px;color:rgba(255,255,255,.6)}
    #progress-box{background:rgba(0,0,0,.3);border-radius:10px;padding:9px 12px}
    #progress-label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;font-weight:700}
    #progress-pct{color:rgba(255,255,255,.75)}
    #progress-bar-bg{background:rgba(0,0,0,.4);border-radius:4px;height:7px;overflow:hidden}
    #progress-bar{height:100%;background:linear-gradient(90deg,#a78bfa,#7c3aed);border-radius:4px;transition:width .4s ease}
    #progress-next{font-size:10px;color:rgba(255,255,255,.5);margin-top:4px}

    /* ── Tabs (5 tabs now) ── */
    #tabs{display:flex;background:#111;border-bottom:1px solid #222;position:sticky;top:108px;z-index:19}
    .tab-btn{flex:1;padding:9px 0;background:none;border:none;border-bottom:2px solid transparent;color:#555;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:color .2s}
    .tab-btn.active{border-bottom-color:#7c3aed;color:#a78bfa}
    .tab-icon{font-size:14px}

    /* ── Content ── */
    #content{padding:14px;padding-bottom:48px}

    /* ── Search & Filter ── */
    #search-input{width:100%;padding:9px 13px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;font-size:13px;outline:none;margin-bottom:9px}
    #search-input::placeholder{color:#555}
    #filter-wrap{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:11px;scrollbar-width:none}
    #filter-wrap::-webkit-scrollbar{display:none}
    .filter-btn{padding:5px 11px;border-radius:20px;border:none;background:#1a1a1a;color:#777;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}
    .filter-btn.active{background:#7c3aed;color:#fff}
    #region-bar{background:#111;border-radius:8px;padding:7px 12px;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}
    #region-bar span:first-child{font-size:11px;color:#666}
    #region-count{font-size:12px;font-weight:700;color:#a78bfa}

    /* ── Stamp Grid ── */
    #stamp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .stamp-card{background:#141414;border:2px solid #222;border-radius:12px;padding:8px 6px;cursor:pointer;transition:transform .12s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;min-height:96px}
    .stamp-card.visited{background:linear-gradient(135deg,#4c1d95 0%,#2e1065 100%);border-color:#7c3aed}
    .stamp-card:active{transform:scale(.95)}
    .s-glow{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(124,58,237,.25),transparent 70%);transition:opacity .2s}
    .stamp-card.visited .s-glow{opacity:1}
    .s-name{font-size:10px;font-weight:700;color:#666;text-align:center;line-height:1.3;width:100%;padding:0 2px}
    .stamp-card.visited .s-name{color:#fff}
    .s-icon{width:34px;height:34px;border-radius:50%;background:#1e1e1e;border:2px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0}
    .stamp-card.visited .s-icon{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
    .s-city{font-size:9px;color:#333;text-align:center}
    .stamp-card.visited .s-city{color:rgba(255,255,255,.5)}
    .s-badge{font-size:7px;background:rgba(255,255,255,.15);color:#e9d5ff;padding:2px 5px;border-radius:20px;font-weight:700;display:none}
    .stamp-card.visited .s-badge{display:block}
    .empty-msg{text-align:center;color:#333;padding:48px 0;font-size:14px}

    /* ── Milestone ── */
    .milestone-card{background:#111;border:2px solid #222;border-radius:14px;padding:12px;margin-bottom:8px;transition:all .3s;opacity:.55}
    .milestone-card.achieved{opacity:1}
    .ms-top{display:flex;align-items:center;gap:10px;margin-bottom:7px}
    .ms-icon{font-size:24px;flex-shrink:0}
    .ms-title{font-size:13px;font-weight:800;color:#555}
    .milestone-card.achieved .ms-title{color:#fff}
    .ms-sub{font-size:11px;color:#333}
    .ms-badge{margin-left:auto;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;color:#fff;display:none}
    .milestone-card.achieved .ms-badge{display:block}
    .ms-bar-bg{background:#1e1e1e;border-radius:4px;height:6px;overflow:hidden}
    .ms-bar{height:100%;border-radius:4px;transition:width .5s ease}
    .ms-num{font-size:10px;color:#444;margin-top:3px;text-align:right}

    /* ── Stats ── */
    #stats-hero{border-radius:14px;padding:15px;margin-bottom:11px;background:linear-gradient(135deg,#3b0764,#0d0828);border:1px solid #7c3aed33}
    #stats-hero .lbl{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:3px}
    #stats-hero .bignum{font-size:50px;font-weight:900;line-height:1}
    #stats-hero .bignum small{font-size:14px;font-weight:400;color:#888;margin-left:5px}
    #stats-hero .rate{font-size:12px;color:#a78bfa;margin-top:3px;font-weight:700}
    .region-row{background:#111;border-radius:10px;padding:10px 12px;margin-bottom:7px}
    .rr-top{display:flex;justify-content:space-between;margin-bottom:5px}
    .rr-name{font-size:12px;font-weight:700}
    .rr-cnt{font-size:11px;font-weight:700;color:#7c3aed}
    .rr-cnt.done{color:#34d399}
    .rbar-bg{background:#1a1a1a;border-radius:4px;height:5px}
    .rbar{height:100%;border-radius:4px;background:linear-gradient(90deg,#7c3aed,#5b21b6);transition:width .4s}
    .rbar.full{background:linear-gradient(90deg,#34d399,#059669)}
    #recent-box{background:#111;border-radius:10px;padding:11px;margin-top:4px}
    .rl{font-size:11px;color:#555;margin-bottom:7px}
    .ri{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #1a1a1a}
    .ri:last-child{border-bottom:none}
    .ri-ico{font-size:13px}
    .ri-n{font-size:12px;font-weight:700}
    .ri-p{font-size:10px;color:#444}

    /* ── MAP TAB ── */
    #map-container{border-radius:12px;overflow:hidden;margin-bottom:12px;position:relative}
    #map{height:340px;width:100%;background:#111}
    #map-legend{display:flex;gap:12px;align-items:center;font-size:11px;color:#888;padding:8px 4px}
    .leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    /* leaflet dark overrides */
    .leaflet-container{background:#1a1a2e}
    .leaflet-tile{filter:brightness(.75) saturate(.6) hue-rotate(180deg)}
    .leaflet-popup-content-wrapper{background:#1a1a2e;border:1px solid #7c3aed;border-radius:10px;color:#fff;box-shadow:0 4px 20px rgba(124,58,237,.3)}
    .leaflet-popup-tip{background:#7c3aed}
    .leaflet-popup-content{margin:10px 14px;font-size:13px}
    .map-popup-name{font-weight:800;font-size:14px;margin-bottom:4px}
    .map-popup-info{color:#aaa;font-size:11px;margin-bottom:8px}
    .map-popup-btns{display:flex;gap:6px}
    .map-popup-btn{flex:1;padding:6px 0;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
    .map-popup-visit{background:#7c3aed;color:#fff}
    .map-popup-visit.visited{background:#34d399;color:#000}
    .map-popup-comment{background:#222;color:#a78bfa}
    #map-filter-bar{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
    #map-filter-bar::-webkit-scrollbar{display:none}
    .map-flt{padding:4px 10px;border-radius:20px;border:none;background:#1a1a1a;color:#777;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap}
    .map-flt.active{background:#7c3aed;color:#fff}

    /* ── DETAIL SHEET ── */
    #detail-sheet{position:fixed;inset:0;z-index:90;pointer-events:none}
    #detail-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7);opacity:0;transition:opacity .25s;pointer-events:none}
    #detail-sheet.open #detail-backdrop{opacity:1;pointer-events:auto}
    #detail-panel{position:absolute;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:#111;border-radius:20px 20px 0 0;padding:20px 18px 40px;transition:transform .3s cubic-bezier(.32,0,.67,0);pointer-events:none;max-height:85dvh;overflow-y:auto}
    #detail-sheet.open #detail-panel{transform:translateX(-50%) translateY(0);pointer-events:auto}
    #detail-handle{width:36px;height:4px;background:#333;border-radius:2px;margin:0 auto 16px}
    #detail-gym-name{font-size:18px;font-weight:900;margin-bottom:3px}
    #detail-gym-sub{font-size:12px;color:#888;margin-bottom:16px}
    #detail-visit-btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:14px;transition:all .2s}
    #detail-visit-btn.not-visited{background:#7c3aed;color:#fff}
    #detail-visit-btn.visited{background:#34d399;color:#000}
    #detail-share-row{display:flex;gap:8px;margin-bottom:16px}
    .share-btn{flex:1;padding:10px 0;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .15s}
    .share-btn:active{transform:scale(.95)}
    .share-x{background:#000;color:#fff;border:1px solid #333}
    .share-line{background:#06C755;color:#fff}
    .share-copy{background:#1a1a1a;color:#a78bfa;border:1px solid #333}
    .share-native{background:#5b21b6;color:#fff}
    #detail-comment-section{margin-top:4px}
    #detail-comment-title{font-size:13px;font-weight:700;color:#888;margin-bottom:8px}
    #detail-comment-input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;color:#fff;font-size:13px;padding:10px 12px;resize:none;outline:none;font-family:inherit;height:72px}
    #detail-comment-input::placeholder{color:#444}
    #detail-comment-save{margin-top:6px;width:100%;padding:10px;background:#7c3aed;border:none;border-radius:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
    #detail-comment-saved{margin-top:8px}
    .saved-comment{background:#1a1a1a;border-radius:8px;padding:9px 11px;font-size:12px;color:#ddd;position:relative;margin-bottom:5px}
    .saved-comment-del{position:absolute;top:8px;right:8px;background:none;border:none;color:#555;font-size:12px;cursor:pointer}
    /* map btn on stamp tab */
    .stamp-card-map-btn{position:absolute;bottom:3px;right:3px;background:rgba(124,58,237,.6);border:none;border-radius:5px;color:#fff;font-size:8px;padding:2px 4px;cursor:pointer;display:none}
    .stamp-card.visited .stamp-card-map-btn{display:block}

    /* ── Celebration ── */
    #celebration{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer}
    #celebration.show{display:flex}
    #cel-icon{font-size:72px}
    #cel-title{font-size:24px;font-weight:900;text-align:center}
    #cel-sub{font-size:14px;color:#aaa;text-align:center;padding:0 20px}
    #cel-share{display:flex;gap:8px;margin-top:4px}
    .cel-share-btn{padding:9px 18px;border:none;border-radius:30px;font-size:12px;font-weight:700;cursor:pointer}
    #cel-close-btn{font-size:12px;padding:9px 22px;border-radius:30px;background:#1a1a1a;color:#fff;border:1px solid #7c3aed;margin-top:4px}

    /* ── Toast ── */
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e0a45;border:1px solid #7c3aed;border-radius:10px;padding:10px 18px;font-size:12px;color:#e9d5ff;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;white-space:nowrap}
    #toast.show{opacity:1}
    #install-toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1e0a45;border:1px solid #7c3aed;border-radius:12px;padding:10px 16px;font-size:12px;color:#e9d5ff;display:none;align-items:center;gap:8px;z-index:50;white-space:nowrap;cursor:pointer;box-shadow:0 4px 24px rgba(124,58,237,.3)}
    #install-toast.show{display:flex}
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div id="header-top">
    <div id="logo-box">🏋️</div>
    <div style="flex:1">
      <div id="app-title">ANYTIME STAMP RALLY</div>
      <div id="app-sub">エニタイムフィットネス 全国スタンプラリー</div>
    </div>
  </div>
  <div id="progress-box">
    <div id="progress-label">
      <span id="progress-text">0 / 160 店舗</span>
      <span id="progress-pct">0% 制覇</span>
    </div>
    <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
    <div id="progress-next"></div>
  </div>
</div>

<!-- Tabs -->
<div id="tabs">
  <button class="tab-btn active" data-tab="stamp" onclick="switchTab('stamp')"><span class="tab-icon">🗺️</span>スタンプ</button>
  <button class="tab-btn" data-tab="map" onclick="switchTab('map')"><span class="tab-icon">📍</span>地図</button>
  <button class="tab-btn" data-tab="milestones" onclick="switchTab('milestones')"><span class="tab-icon">🏆</span>実績</button>
  <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')"><span class="tab-icon">📊</span>統計</button>
  <button class="tab-btn" data-tab="share" onclick="switchTab('share')"><span class="tab-icon">🔗</span>シェア</button>
</div>

<!-- Content -->
<div id="content"></div>

<!-- Detail Sheet -->
<div id="detail-sheet">
  <div id="detail-backdrop" onclick="closeDetail()"></div>
  <div id="detail-panel">
    <div id="detail-handle"></div>
    <div id="detail-gym-name"></div>
    <div id="detail-gym-sub"></div>
    <button id="detail-visit-btn" class="not-visited" onclick="detailToggleVisit()">✓ 訪問済みにする</button>
    <div id="detail-share-row">
      <button class="share-btn share-x" onclick="shareX()"><span style="font-size:16px">𝕏</span>X</button>
      <button class="share-btn share-line" onclick="shareLine()"><span style="font-size:16px">💬</span>LINE</button>
      <button class="share-btn share-copy" onclick="shareCopy()"><span style="font-size:16px">📋</span>コピー</button>
      <button class="share-btn share-native" onclick="shareNative()"><span style="font-size:16px">↗</span>シェア</button>
    </div>
    <div id="detail-comment-section">
      <div id="detail-comment-title">📝 メモ・コメント</div>
      <textarea id="detail-comment-input" placeholder="訪問した感想、おすすめ設備など..."></textarea>
      <button id="detail-comment-save" onclick="saveComment()">保存する</button>
      <div id="detail-comment-saved"></div>
    </div>
  </div>
</div>

<!-- Celebration -->
<div id="celebration" onclick="hideCelebration()">
  <div id="cel-icon"></div>
  <div id="cel-title"></div>
  <div id="cel-sub"></div>
  <div id="cel-share">
    <button class="cel-share-btn" style="background:#000;color:#fff" onclick="event.stopPropagation();celShareX()">𝕏 シェア</button>
    <button class="cel-share-btn" style="background:#06C755;color:#fff" onclick="event.stopPropagation();celShareLine()">LINE</button>
  </div>
  <button id="cel-close-btn" onclick="hideCelebration()">閉じる ✕</button>
</div>

<!-- Toast -->
<div id="toast"></div>
<!-- Install Toast -->
<div id="install-toast" onclick="installPWA()">＋ ホーム画面に追加する</div>

// ── State ──
let visited  = new Set(JSON.parse(localStorage.getItem("af_visited")||"[]"));
let comments = JSON.parse(localStorage.getItem("af_comments")||"{}");
let activeRegion = "全店舗";
let activeTab    = "stamp";
let searchQ      = "";
let detailGymId  = null;
let leafletMap   = null;
let mapMarkers   = {};
let mapRegion    = "全店舗";
let deferredPrompt = null;

function save() {
  localStorage.setItem("af_visited",  JSON.stringify([...visited]));
  localStorage.setItem("af_comments", JSON.stringify(comments));
  updateHeader();
}

// ── Header ──
function updateHeader() {
  const n   = visited.size, total = GYMS.length;
  const pct = Math.round(n/total*100);
  document.getElementById("progress-text").textContent = `${n} / ${total} 店舗`;
  document.getElementById("progress-pct").textContent  = `${pct}% 制覇`;
  document.getElementById("progress-bar").style.width  = pct+"%";
  const next = MILESTONES.find(m=>m.count>n);
  document.getElementById("progress-next").textContent = next
    ? `次の実績まであと ${next.count-n} 店舗（${next.label}）` : "🎉 全実績解除！";
}

// ── Toast ──
let _toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

// ── Tab ──
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  render();
}

// ── Toggle visit ──
function toggleVisit(id) {
  const was = visited.has(id);
  if (was) { visited.delete(id); }
  else {
    visited.add(id);
    const ms = MILESTONES.find(m=>m.count===visited.size);
    if (ms) showCelebration(ms);
  }
  save();
  // patch single stamp card
  const card = document.querySelector(`.stamp-card[data-id="${id}"]`);
  if (card) card.outerHTML = stampCardHTML(GYMS.find(g=>g.id===id), !was, parseInt(card.dataset.idx));
  // patch map marker if map open
  if (activeTab==="map" && mapMarkers[id]) refreshMarker(id);
  if (activeTab!=="stamp") render();
}

// ── Detail sheet ──
function openDetail(gymId) {
  detailGymId = gymId;
  const g = GYMS.find(x=>x.id===gymId);
  if (!g) return;
  document.getElementById("detail-gym-name").textContent = g.name;
  document.getElementById("detail-gym-sub").textContent  = `${g.pref} ${g.city}`;
  updateDetailVisitBtn();
  // comment
  const savedComments = comments[gymId] || [];
  document.getElementById("detail-comment-input").value = "";
  renderSavedComments(gymId);
  document.getElementById("detail-sheet").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeDetail() {
  document.getElementById("detail-sheet").classList.remove("open");
  document.body.style.overflow = "";
}
function updateDetailVisitBtn() {
  const btn = document.getElementById("detail-visit-btn");
  const isV = visited.has(detailGymId);
  btn.className = "detail-visit-btn " + (isV ? "visited" : "not-visited");
  btn.style.cssText = isV
    ? "width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:14px;background:#34d399;color:#000"
    : "width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:14px;background:#7c3aed;color:#fff";
  btn.textContent = isV ? "✓ 訪問済み（タップで解除）" : "＋ 訪問済みにする";
}
function detailToggleVisit() {
  toggleVisit(detailGymId);
  updateDetailVisitBtn();
}

// ── Comments ──
function saveComment() {
  const input = document.getElementById("detail-comment-input");
  const text  = input.value.trim();
  if (!text) return;
  if (!comments[detailGymId]) comments[detailGymId] = [];
  comments[detailGymId].push({text, date: new Date().toLocaleDateString("ja-JP")});
  save();
  input.value = "";
  renderSavedComments(detailGymId);
  showToast("コメントを保存しました ✓");
}
function deleteComment(gymId, idx) {
  if (comments[gymId]) {
    comments[gymId].splice(idx, 1);
    save();
    renderSavedComments(gymId);
  }
}
function renderSavedComments(gymId) {
  const box = document.getElementById("detail-comment-saved");
  const list = comments[gymId] || [];
  box.innerHTML = list.length === 0 ? ""
    : list.map((c,i)=>`<div class="saved-comment">
        <div style="font-size:10px;color:#666;margin-bottom:4px">${c.date}</div>
        <div>${c.text.replace(/</g,"&lt;")}</div>
        <button class="saved-comment-del" onclick="deleteComment(${gymId},${i})">✕</button>
      </div>`).join("");
}

// ── Share functions ──
function gymShareText(gymId) {
  const g = GYMS.find(x=>x.id===gymId);
  if (!g) return "";
  const isV = visited.has(gymId);
  return isV
    ? `💪 エニタイムフィットネス ${g.name}（${g.pref}）を制覇しました！\n現在 ${visited.size}/${GYMS.length} 店舗達成中 🏋️\n#エニタイムスタンプラリー #AnytimeFitness`
    : `🏋️ エニタイムフィットネス ${g.name}（${g.pref}）に挑戦中！\n#エニタイムスタンプラリー #AnytimeFitness`;
}
function overallShareText() {
  const pct = Math.round(visited.size/GYMS.length*100);
  const ms  = [...MILESTONES].reverse().find(m=>visited.size>=m.count);
  return `${ms?ms.icon:"🏋️"} エニタイムフィットネス 全国スタンプラリー\n現在 ${visited.size}/${GYMS.length} 店舗（${pct}%）制覇中！\n${ms?"「"+ms.label+"」達成！\n":""}#エニタイムスタンプラリー #AnytimeFitness`;
}
function shareX()      { const t=detailGymId?gymShareText(detailGymId):overallShareText(); window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(t),"_blank"); }
function shareLine()   { const t=detailGymId?gymShareText(detailGymId):overallShareText(); window.open("https://social-plugins.line.me/lineit/share?url="+encodeURIComponent(location.href)+"&text="+encodeURIComponent(t),"_blank"); }
function shareCopy()   { const t=detailGymId?gymShareText(detailGymId):overallShareText(); navigator.clipboard.writeText(t).then(()=>showToast("コピーしました！")); }
async function shareNative() {
  const t=detailGymId?gymShareText(detailGymId):overallShareText();
  if (navigator.share) { try { await navigator.share({title:"エニタイムスタンプラリー",text:t}); } catch(e){} }
  else shareCopy();
}
function celShareX()    { const ms=MILESTONES.find(m=>m.count===visited.size); if(ms){const t=`${ms.icon} エニタイムフィットネス スタンプラリー「${ms.label}」達成！\n${ms.count}店舗制覇しました 💪\n#エニタイムスタンプラリー #AnytimeFitness`; window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(t),"_blank");} }
function celShareLine() { const ms=MILESTONES.find(m=>m.count===visited.size); if(ms){const t=`${ms.icon} エニタイムフィットネス スタンプラリー「${ms.label}」達成！\n${ms.count}店舗制覇しました 💪\n#エニタイムスタンプラリー #AnytimeFitness`; window.open("https://social-plugins.line.me/lineit/share?url="+encodeURIComponent(location.href)+"&text="+encodeURIComponent(t),"_blank");} }

// ── Stamp card ──
function stampCardHTML(gym, isV, idx) {
  const icon = isV ? STAMP_ICONS[idx%STAMP_ICONS.length] : "✕";
  // Shorten name: remove prefecture prefix if present, keep store name up to 8 chars
  let name = gym.name;
  // e.g. "札幌大通店" -> "札幌大通店", "名古屋栄店" -> "名古屋栄店"
  if (name.length > 8) name = name.slice(0,8)+"…";
  const hasComment = (comments[gym.id]||[]).length > 0;
  return `<button class="stamp-card${isV?" visited":""}" data-id="${gym.id}" data-idx="${idx}"
    onclick="toggleVisit(${gym.id})" oncontextmenu="event.preventDefault();openDetail(${gym.id})">
    <div class="s-glow"></div>
    <div class="s-name">${name}</div>
    <div class="s-icon">${icon}</div>
    <div class="s-city">${gym.city||gym.pref}</div>
    <div class="s-badge">${hasComment?"📝":"✓"} VISITED</div>
  </button>`;
}

// ── Render ──
function render() {
  const el = document.getElementById("content");
  if      (activeTab==="stamp")      renderStamp(el);
  else if (activeTab==="map")        renderMap(el);
  else if (activeTab==="milestones") renderMilestones(el);
  else if (activeTab==="stats")      renderStats(el);
  else if (activeTab==="share")      renderShare(el);
}

// ── Stamp tab ──
function getFiltered() {
  const q = searchQ.trim();
  return GYMS.filter(g=>{
    const rOk = activeRegion==="全店舗"||g.region===activeRegion;
    const sOk = !q||g.name.includes(q)||g.pref.includes(q)||(g.city&&g.city.includes(q));
    return rOk && sOk;
  });
}
function renderStamp(el) {
  const filtered = getFiltered();
  const vCnt = filtered.filter(g=>visited.has(g.id)).length;
  el.innerHTML = `
    <input id="search-input" type="search" placeholder="🔍 店舗名・都道府県・市区町村で検索..."
      value="${searchQ.replace(/"/g,'&quot;')}" autocomplete="off" inputmode="search">
    <div id="filter-wrap">${REGIONS.map(r=>`<button class="filter-btn${activeRegion===r?" active":""}" onclick="setRegion('${r}')">${r}</button>`).join("")}</div>
    <div id="region-bar">
      <span>${activeRegion==="全店舗"?"全店舗 📍":"📍 "+activeRegion}</span>
      <span id="region-count">${vCnt} / ${filtered.length} 訪問済み</span>
    </div>
    <div id="stamp-grid">${filtered.length===0
      ? `<div class="empty-msg" style="grid-column:1/-1">該当なし</div>`
      : filtered.map((g,i)=>stampCardHTML(g,visited.has(g.id),i)).join("")}
    </div>
    <p style="font-size:10px;color:#333;text-align:center;margin-top:14px">長押し・右クリックで詳細・コメント</p>`;
  // Attach search event directly to the element (not oninput attr) to preserve focus
  const inp = document.getElementById("search-input");
  if (inp) {
    inp.addEventListener("input", e=>{ searchQ=e.target.value; updateStampGrid(); updateRegionCount(); });
    inp.focus();
  }
}
function updateStampGrid() {
  const grid = document.getElementById("stamp-grid");
  const rcnt = document.getElementById("region-count");
  if (!grid) return;
  const filtered = getFiltered();
  grid.innerHTML = filtered.length===0
    ? `<div class="empty-msg" style="grid-column:1/-1">該当なし</div>`
    : filtered.map((g,i)=>stampCardHTML(g,visited.has(g.id),i)).join("");
  if (rcnt) rcnt.textContent = `${filtered.filter(g=>visited.has(g.id)).length} / ${filtered.length} 訪問済み`;
}
function updateRegionCount() {
  const rcnt = document.getElementById("region-count");
  if (!rcnt) return;
  const filtered = getFiltered();
  rcnt.textContent = `${filtered.filter(g=>visited.has(g.id)).length} / ${filtered.length} 訪問済み`;
}

// ── Map tab ──
function renderMap(el) {
  el.innerHTML = `
    <div id="map-filter-bar">${REGIONS.map(r=>`<button class="map-flt${mapRegion===r?" active":""}" onclick="setMapRegion('${r}')">${r}</button>`).join("")}</div>
    <div id="map-container"><div id="map"></div></div>
    <div id="map-legend">
      <div class="leg-dot" style="background:#7c3aed"></div><span>未訪問</span>
      <div class="leg-dot" style="background:#34d399;margin-left:10px"></div><span>訪問済み</span>
      <span style="margin-left:auto;font-size:10px">${visited.size}/${GYMS.length} 制覇</span>
    </div>`;
  initMap();
}
function initMap() {
  if (leafletMap) { leafletMap.remove(); leafletMap=null; mapMarkers={}; }
  leafletMap = L.map("map",{center:[36.5,137.5],zoom:5,zoomControl:true,attributionControl:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18}).addTo(leafletMap);

  const filtered = mapRegion==="全店舗" ? GYMS : GYMS.filter(g=>g.region===mapRegion);
  filtered.forEach(g=>{
    const isV = visited.has(g.id);
    const marker = L.circleMarker([g.lat,g.lng],{
      radius:isV?9:7, fillColor:isV?"#34d399":"#7c3aed",
      color:isV?"#fff":"#a78bfa", weight:2, fillOpacity:.9
    }).addTo(leafletMap);
    marker.bindPopup(mapPopupHTML(g));
    marker.on("click",()=>{ marker.openPopup(); });
    mapMarkers[g.id] = marker;
  });
}
function mapPopupHTML(g) {
  const isV = visited.has(g.id);
  const cCnt = (comments[g.id]||[]).length;
  return `<div class="map-popup-name">${g.name}</div>
    <div class="map-popup-info">${g.pref} ${g.city}${cCnt>0?` · 📝 ${cCnt}件`:""}</div>
    <div class="map-popup-btns">
      <button class="map-popup-btn map-popup-visit${isV?" visited":""}" onclick="mapToggleVisit(${g.id})">${isV?"✓ 訪問済み":"＋ 訪問済みに"}</button>
      <button class="map-popup-btn map-popup-comment" onclick="leafletMap.closePopup();openDetail(${g.id})">📝 詳細</button>
    </div>`;
}
function mapToggleVisit(id) {
  toggleVisit(id);
  refreshMarker(id);
}
function refreshMarker(id) {
  const g = GYMS.find(x=>x.id===id);
  if (!g || !mapMarkers[id]) return;
  const isV = visited.has(id);
  mapMarkers[id].setStyle({fillColor:isV?"#34d399":"#7c3aed",color:isV?"#fff":"#a78bfa",radius:isV?9:7});
  mapMarkers[id].setPopupContent(mapPopupHTML(g));
}
function setMapRegion(r) { mapRegion=r; if(activeTab==="map") render(); }

// ── Milestones ──
function renderMilestones(el) {
  el.innerHTML = `<p style="font-size:12px;color:#666;margin-bottom:11px">スタンプを集めてバッジを獲得しよう！</p>`
    + MILESTONES.map(m=>{
      const a = visited.size>=m.count;
      const p = Math.min(100,Math.round(visited.size/m.count*100));
      return `<div class="milestone-card${a?" achieved":""}" style="${a?`border-color:${m.color}44;background:linear-gradient(135deg,${m.color}18,${m.color}08)`:""}">
        <div class="ms-top">
          <div class="ms-icon">${m.icon}</div>
          <div><div class="ms-title">${m.label}</div>
            <div class="ms-sub" style="color:${a?m.color+"aa":"#333"}">${m.count}店舗達成</div></div>
          <div class="ms-badge" style="background:${m.color}">達成！</div>
        </div>
        <div class="ms-bar-bg"><div class="ms-bar" style="width:${p}%;background:linear-gradient(90deg,${m.color},${m.color}99)"></div></div>
        <div class="ms-num">${Math.min(visited.size,m.count)} / ${m.count}</div>
      </div>`;
    }).join("");
}

// ── Stats ──
function renderStats(el) {
  const n=visited.size, total=GYMS.length, pct=Math.round(n/total*100);
  const regionRows = REGIONS.slice(1).map(r=>{
    const rg=GYMS.filter(g=>g.region===r), done=rg.filter(g=>visited.has(g.id)).length;
    const rp=Math.round(done/rg.length*100), full=done===rg.length;
    return `<div class="region-row">
      <div class="rr-top"><span class="rr-name">${r}</span>
        <span class="rr-cnt${full?" done":""}">${done}/${rg.length}${full?" ✓完全制覇":""}</span></div>
      <div class="rbar-bg"><div class="rbar${full?" full":""}" style="width:${rp}%;min-width:${done>0?"5px":"0"}"></div></div>
    </div>`;
  }).join("");
  const recent = [...visited].slice(-5).reverse().map(id=>{
    const g=GYMS.find(x=>x.id===id);
    return g?`<div class="ri"><span class="ri-ico">🏋️</span>
      <div><div class="ri-n">${g.name}</div><div class="ri-p">${g.pref} ${g.city}</div></div></div>`:"";
  }).join("");
  el.innerHTML = `
    <div id="stats-hero">
      <div class="lbl">総訪問店舗数</div>
      <div class="bignum">${n}<small>/ ${total} 店舗</small></div>
      <div class="rate">全国制覇率 ${pct}%</div>
    </div>
    <p style="font-size:12px;color:#555;margin-bottom:8px">エリア別進捗</p>
    ${regionRows}
    ${n>0?`<div id="recent-box"><div class="rl">最近訪問した店舗</div>${recent}</div>`:""}`;
}

// ── Share tab ──
function renderShare(el) {
  const n=visited.size, total=GYMS.length, pct=Math.round(n/total*100);
  const ms=[...MILESTONES].reverse().find(m=>n>=m.count);
  const txt = overallShareText();
  // build card preview
  const regions = REGIONS.slice(1).map(r=>{
    const rg=GYMS.filter(g=>g.region===r);
    const done=rg.filter(g=>visited.has(g.id)).length;
    const p=Math.round(done/rg.length*100);
    return `<div style="margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">
        <span>${r}</span><span style="color:#a78bfa">${done}/${rg.length}</span></div>
      <div style="background:#1a1a1a;border-radius:3px;height:4px">
        <div style="width:${p}%;height:100%;background:linear-gradient(90deg,#7c3aed,#5b21b6);border-radius:3px;min-width:${done>0?"4px":"0"}"></div>
      </div></div>`;
  }).join("");
  el.innerHTML = `
    <div style="background:linear-gradient(135deg,#3b0764,#0d0828);border:1px solid #7c3aed44;border-radius:16px;padding:18px;margin-bottom:14px">
      <div style="font-size:11px;color:rgba(255,255,255,.5);margin-bottom:6px">🏋️ ANYTIME STAMP RALLY</div>
      <div style="font-size:40px;font-weight:900;line-height:1">${n}<span style="font-size:14px;color:#888;font-weight:400"> / ${total} 店舗</span></div>
      <div style="font-size:13px;color:#a78bfa;margin:4px 0 14px;font-weight:700">全国制覇率 ${pct}% ${ms?ms.icon:""}</div>
      ${regions}
    </div>
    <p style="font-size:12px;color:#666;margin-bottom:10px">シェア先を選んでください</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
      <button class="share-btn share-x" style="padding:14px;border-radius:12px;font-size:13px" onclick="detailGymId=null;shareX()"><span style="font-size:20px">𝕏</span><span>Xでシェア</span></button>
      <button class="share-btn share-line" style="padding:14px;border-radius:12px;font-size:13px" onclick="detailGymId=null;shareLine()"><span style="font-size:20px">💬</span><span>LINEでシェア</span></button>
      <button class="share-btn share-copy" style="padding:14px;border-radius:12px;font-size:13px" onclick="detailGymId=null;shareCopy()"><span style="font-size:20px">📋</span><span>テキストコピー</span></button>
      <button class="share-btn share-native" style="padding:14px;border-radius:12px;font-size:13px" onclick="detailGymId=null;shareNative()"><span style="font-size:20px">↗</span><span>その他</span></button>
    </div>
    <div style="background:#111;border-radius:12px;padding:12px;font-size:12px;color:#777;white-space:pre-line;line-height:1.6">${txt.replace(/</g,"&lt;")}</div>`;
}

// ── Celebration ──
function showCelebration(ms) {
  document.getElementById("cel-icon").textContent   = ms.icon;
  document.getElementById("cel-title").textContent  = ms.label+" 達成！";
  document.getElementById("cel-title").style.color  = ms.color;
  document.getElementById("cel-sub").textContent    = `${ms.count}店舗訪問おめでとう！🎉`;
  document.getElementById("celebration").classList.add("show");
}
function hideCelebration() { document.getElementById("celebration").classList.remove("show"); }

// ── Helpers ──
function setRegion(r) {
  activeRegion=r;
  if (activeTab==="stamp") {
    // update filter buttons active state
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.toggle("active",b.textContent===r));
    updateStampGrid();
  } else { render(); }
}
function setSearch(v) { searchQ=v; render(); }

// ── PWA ──
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById("install-toast").classList.add("show");
});
function installPWA() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; document.getElementById("install-toast").classList.remove("show"); });
}
window.addEventListener("appinstalled",()=>document.getElementById("install-toast").classList.remove("show"));

// ── Init ──
updateHeader();
render();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}</script>
</body>
</html>
